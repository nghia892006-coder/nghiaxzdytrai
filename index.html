<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💐 Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    touch-action: manipulation;
  }

  /* Canvas hiệu ứng hoa rơi */
  #canvas-flower {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* Container chính */
  .container {
    text-align: center;
    padding: 40px 30px;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 25px;
    box-shadow: 0 20px 60px rgba(255, 105, 180, 0.4);
    max-width: 600px;
    width: 90%;
    z-index: 10;
    animation: fadeInUp 1.2s ease-out;
    border: 2px solid rgba(255, 182, 193, 0.6);
    position: relative;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(50px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Tiêu đề */
  .title {
    font-size: 3.5rem;
    font-weight: 900;
    background: linear-gradient(135deg, #e91e63, #ff5722, #e91e63);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 15px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .subtitle {
    font-size: 1.4rem;
    color: #d63384;
    margin-bottom: 25px;
    font-weight: 600;
  }

  /* Trái tim */
  .hearts {
    font-size: 2rem;
    margin: 15px 0;
    letter-spacing: 10px;
    animation: heartbeat 1.5s infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    50% { transform: scale(1); }
    75% { transform: scale(1.1); }
  }

  /* Lời chúc */
  .message {
    font-size: 1.1rem;
    color: #555;
    line-height: 1.8;
    margin: 20px 0;
    padding: 0 15px;
  }

  .message .highlight {
    color: #e91e63;
    font-weight: bold;
  }

  /* Nút */
  .btn {
    display: inline-block;
    padding: 15px 40px;
    margin-top: 20px;
    font-size: 1.1rem;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #ff6b9d, #e91e63);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    -webkit-appearance: none;
    appearance: none;
  }

  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(233, 30, 99, 0.6);
  }

  .btn:active {
    transform: translateY(0);
  }

  /* Nút nhạc */
  .music-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b9d, #e91e63);
    color: white;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(233, 30, 99, 0.5);
    z-index: 999;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5rem;
    transition: all 0.3s ease;
    -webkit-appearance: none;
    appearance: none;
  }

  .music-btn:hover {
    transform: scale(1.1);
  }

  .music-btn.playing {
    animation: musicPulse 1s infinite;
  }

  @keyframes musicPulse {
    0%, 100% { box-shadow: 0 8px 20px rgba(233, 30, 99, 0.5); }
    50% { box-shadow: 0 8px 30px rgba(233, 30, 99, 0.8); }
  }

  /* Tim bay khi click */
  .click-heart {
    position: fixed;
    font-size: 2rem;
    pointer-events: none;
    animation: floatUp 2s ease-out forwards;
    z-index: 100;
    will-change: transform, opacity;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-200px) scale(2); }
  }

  /* Trang trí hoa ở góc */
  .corner-decoration {
    position: fixed;
    font-size: 3rem;
    opacity: 0.7;
    z-index: 2;
    pointer-events: none;
  }

  .corner-tl { top: 20px; left: 20px; animation: sway 3s ease-in-out infinite; }
  .corner-tr { top: 20px; right: 20px; animation: sway 3s ease-in-out infinite reverse; }
  .corner-bl { bottom: 20px; left: 20px; animation: sway 3s ease-in-out infinite; }
  .corner-br { bottom: 20px; right: 20px; animation: sway 3s ease-in-out infinite reverse; }

  @keyframes sway {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  /* Responsive cho điện thoại */
  @media (max-width: 600px) {
    .title { font-size: 2.3rem; }
    .subtitle { font-size: 1.1rem; }
    .message { font-size: 1rem; }
    .btn { padding: 12px 30px; font-size: 1rem; }
    .corner-decoration { font-size: 2rem; }
    .container {
      padding: 30px 20px;
      width: 92%;
    }
    .music-btn {
      width: 50px;
      height: 50px;
      bottom: 15px;
      right: 15px;
      font-size: 1.3rem;
    }
    .click-heart {
      font-size: 1.5rem;
    }
  }

  /* Ẩn iframe nhạc */
  #yt-player {
    position: fixed;
    top: -9999px;
    left: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

  <!-- Canvas hiệu ứng hoa rơi -->
  <canvas id="canvas-flower"></canvas>

  <!-- Trang trí góc -->
  <div class="corner-decoration corner-tl">🌷</div>
  <div class="corner-decoration corner-tr">🌹</div>
  <div class="corner-decoration corner-bl">🌺</div>
  <div class="corner-decoration corner-br">🌻</div>

  <!-- Trình phát nhạc ẩn -->
  <div id="yt-player"></div>

  <!-- Nút bật/tắt nhạc -->
  <button class="music-btn" id="musicBtn" onclick="toggleMusic()" title="Bật/Tắt nhạc">🔇</button>

  <!-- Nội dung chính -->
  <div class="container">
    <div class="title">20/10</div>
    <div class="subtitle">🌸 Chúc Mừng Ngày Phụ Nữ 🌸</div>

    <div class="hearts">💖 💐 💖</div>

    <div class="message">
      Nhân ngày <span class="highlight">bn thuý 20/10 vv nhó </span>,<br>
      chúc bạn luôn <span class="highlight">xinh đẹp, hạnh phúc</span> và tràn đầy yêu thương.<br>
      Mong mọi điều tốt lành nhất sẽ đến với bạn! 💕
    </div>

    <button class="btn" onclick="showSurprise()">💌 Nhấn để nhận lời chúc</button>
  </div>

<script>
  /* ============================================================
     1. HIỆU ỨNG HOA RƠI BẰNG CANVAS (TỐI ƯU CHO MOBILE)
     ============================================================ */
  (function() {
    const canvas = document.getElementById('canvas-flower');
    const ctx = canvas.getContext('2d');

    // Cấu hình
    const CONFIG = {
      maxParticlesDesktop: 35,
      maxParticlesMobile: 18,
      minSize: 12,
      maxSize: 28,
      speedY: 0.8,
      speedX: 0.3,
      rotationSpeed: 0.02,
      swayAmplitude: 0.5,
      swayFrequency: 0.008
    };

    // Phát hiện mobile
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
                     || window.innerWidth < 768;

    const MAX_PARTICLES = isMobile ? CONFIG.maxParticlesMobile : CONFIG.maxParticlesDesktop;

    // Danh sách emoji hoa
    const FLOWER_EMOJIS = ['🌸', '🌺', '🌷', '🌹', '💐', '🌼', '💮', '🏵️'];

    let particles = [];
    let animationId = null;
    let isRunning = true;

    // Điều chỉnh kích thước canvas
    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2); // Giới hạn DPR để tránh quá tải
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // Tạo một hạt hoa
    function createParticle() {
      const size = CONFIG.minSize + Math.random() * (CONFIG.maxSize - CONFIG.minSize);
      return {
        x: Math.random() * window.innerWidth,
        y: -size - Math.random() * 100,
        size: size,
        speedY: CONFIG.speedY + Math.random() * 0.6,
        speedX: (Math.random() - 0.5) * CONFIG.speedX * 2,
        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * CONFIG.rotationSpeed * 2,
        emoji: FLOWER_EMOJIS[Math.floor(Math.random() * FLOWER_EMOJIS.length)],
        swayOffset: Math.random() * Math.PI * 2,
        swayAmplitude: 0.3 + Math.random() * CONFIG.swayAmplitude,
        opacity: 0.6 + Math.random() * 0.4
      };
    }

    // Khởi tạo các hạt
    function initParticles() {
      particles = [];
      for (let i = 0; i < MAX_PARTICLES; i++) {
        const p = createParticle();
        p.y = Math.random() * window.innerHeight; // Phân bố đều ban đầu
        particles.push(p);
      }
    }

    // Vẽ một hạt
    function drawParticle(p, time) {
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x + Math.sin(time * CONFIG.swayFrequency + p.swayOffset) * p.swayAmplitude * 20, p.y);
      ctx.rotate(p.rotation);
      ctx.font = p.size + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.emoji, 0, 0);
      ctx.restore();
    }

    // Vòng lặp animation
    function animate(time) {
      if (!isRunning) return;

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        // Cập nhật vị trí
        p.y += p.speedY;
        p.x += p.speedX;
        p.rotation += p.rotationSpeed;

        // Reset khi ra khỏi màn hình
        if (p.y > window.innerHeight + p.size) {
          particles[i] = createParticle();
          particles[i].y = -particles[i].size;
          continue;
        }

        // Wrap ngang
        if (p.x < -p.size * 2) p.x = window.innerWidth + p.size;
        if (p.x > window.innerWidth + p.size * 2) p.x = -p.size;

        drawParticle(p, time);
      }

      animationId = requestAnimationFrame(animate);
    }

    // Xử lý visibility change (tiết kiệm pin)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        isRunning = false;
        if (animationId) cancelAnimationFrame(animationId);
      } else {
        isRunning = true;
        animationId = requestAnimationFrame(animate);
      }
    });

    // Khởi tạo
    resizeCanvas();
    initParticles();
    animationId = requestAnimationFrame(animate);

    // Xử lý resize
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        resizeCanvas();
        initParticles();
      }, 250);
    });

    // Dọn dẹp
    window.addEventListener('beforeunload', () => {
      if (animationId) cancelAnimationFrame(animationId);
    });
  })();


  /* ============================================================
     2. NHẠC NỀN YOUTUBE
     ============================================================ */
  let ytPlayer = null;
  let isMusicPlaying = false;
  const VIDEO_ID = 'UP2pjmsr3eA'; // ID từ link bạn gửi

  // Tải YouTube IFrame API
  function loadYouTubeAPI() {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  }

  // Callback khi API sẵn sàng
  window.onYouTubeIframeAPIReady = function() {
    ytPlayer = new YT.Player('yt-player', {
      height: '1',
      width: '1',
      videoId: VIDEO_ID,
      playerVars: {
        'autoplay': 0, // Không tự động phát (chờ người dùng bấm nút)
        'loop': 1,
        'playlist': VIDEO_ID,
        'controls': 0,
        'showinfo': 0,
        'rel': 0,
        'modestbranding': 1,
        'playsinline': 1
      },
      events: {
        'onReady': onPlayerReady,
        'onStateChange': onPlayerStateChange
      }
    });
  };

  function onPlayerReady(event) {
    console.log('🎵 YouTube Player đã sẵn sàng');
    // Đặt âm lượng mặc định
    event.target.setVolume(60);
  }

  function onPlayerStateChange(event) {
    // Cập nhật trạng thái nút nhạc
    if (event.data === YT.PlayerState.PLAYING) {
      isMusicPlaying = true;
      updateMusicButton(true);
    } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
      isMusicPlaying = false;
      updateMusicButton(false);
    }
  }

  // Bật/tắt nhạc
  function toggleMusic() {
    if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') {
      alert('Trình phát nhạc đang tải, vui lòng thử lại sau vài giây!');
      return;
    }

    if (isMusicPlaying) {
      ytPlayer.pauseVideo();
      isMusicPlaying = false;
      updateMusicButton(false);
    } else {
      ytPlayer.playVideo();
      // Đảm bảo không bị mute
      setTimeout(() => {
        if (ytPlayer && typeof ytPlayer.unMute === 'function') {
          ytPlayer.unMute();
          ytPlayer.setVolume(60);
        }
      }, 100);
      isMusicPlaying = true;
      updateMusicButton(true);
    }
  }

  // Cập nhật giao diện nút nhạc
  function updateMusicButton(playing) {
    const btn = document.getElementById('musicBtn');
    if (playing) {
      btn.textContent = '🔊';
      btn.classList.add('playing');
      btn.title = 'Tắt nhạc';
    } else {
      btn.textContent = '🔇';
      btn.classList.remove('playing');
      btn.title = 'Bật nhạc';
    }
  }

  // Khởi tạo YouTube API
  loadYouTubeAPI();


  /* ============================================================
     3. HIỆU ỨNG TIM BAY KHI CLICK
     ============================================================ */
  document.addEventListener('click', function(e) {
    // Bỏ qua nếu click vào nút nhạc hoặc nút chính
    if (e.target.closest('.music-btn') || e.target.closest('.btn')) return;

    const heart = document.createElement('div');
    heart.className = 'click-heart';
    heart.textContent = ['💖', '💕', '💗', '💝', '❤️'][Math.floor(Math.random() * 5)];
    heart.style.left = (e.clientX - 15) + 'px';
    heart.style.top = (e.clientY - 15) + 'px';
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 2000);
  });

  // Hỗ trợ touch trên mobile
  document.addEventListener('touchstart', function(e) {
    if (e.target.closest('.music-btn') || e.target.closest('.btn')) return;
    const touch = e.touches[0];
    const heart = document.createElement('div');
    heart.className = 'click-heart';
    heart.textContent = ['💖', '💕', '💗'][Math.floor(Math.random() * 3)];
    heart.style.left = (touch.clientX - 15) + 'px';
    heart.style.top = (touch.clientY - 15) + 'px';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 2000);
  }, { passive: true });


  /* ============================================================
     4. NÚT NHẬN LỜI CHÚC
     ============================================================ */
  const wishes = [
    "Chúc bạn luôn rạng rỡ như hoa hướng dương 🌻",
    "Chúc bạn ngày càng xinh đẹp và thành công 💐",
    "Mong bạn luôn hạnh phúc và bình an 🌷",
    "Chúc bạn có một ngày 20/10 thật ý nghĩa 💖",
    "Bạn là đóa hoa đẹp nhất, đừng bao giờ quên điều đó 🌹",
    "Chúc bạn mãi mãi tươi trẻ và tràn đầy sức sống 🌸",
    "Mong nụ cười của bạn luôn rạng ngời trên môi 😊",
    "Quà độc quyền bn nghĩa tạng khôn đụng hàng 🖕🏼"
  ];

  function showSurprise() {
    const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
    const popup = document.createElement('div');
    popup.innerHTML = randomWish;
    popup.style.cssText = `
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(135deg, #ff6b9d, #e91e63);
      color: white;
      padding: 25px 40px;
      border-radius: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      box-shadow: 0 15px 40px rgba(233, 30, 99, 0.5);
      z-index: 1000;
      text-align: center;
      transition: all 0.4s ease;
      max-width: 85%;
      line-height: 1.6;
    `;
    document.body.appendChild(popup);

    setTimeout(() => {
      popup.style.transform = 'translate(-50%, -50%) scale(1)';
    }, 50);

    setTimeout(() => {
      popup.style.transform = 'translate(-50%, -50%) scale(0)';
      setTimeout(() => popup.remove(), 400);
    }, 2500);

    // Bắn tim
    for (let i = 0; i < 15; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'click-heart';
        h.textContent = ['💖', '💕', '💗', '💝'][Math.floor(Math.random() * 4)];
        h.style.left = (window.innerWidth / 2 + (Math.random() - 0.5) * 300) + 'px';
        h.style.top = (window.innerHeight / 2) + 'px';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 2000);
      }, i * 80);
    }
  }
</script>

</body>
</html>
